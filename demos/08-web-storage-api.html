<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <title>កូដគំរូ 08: HTML5 Web Storage API (localStorage Demo)</title>
</head>
<body>

  <h1>HTML5 Web Storage API (localStorage Demo)</h1>
  <p>
    <b>localStorage</b> អនុញ្ញាតឱ្យគេហទំព័ររក្សាទុកទិន្នន័យ (Key-Value) នៅក្នុង Browser របស់អ្នកប្រើប្រាស់បានរហូត ទោះបីជាបិទ Tab ឬ Refresh ទំព័រ ក៏ទិន្នន័យមិនបាត់បង់ដែរ។
  </p>
  <hr>

  <p>
    <label for="usernameInput"><b>បញ្ចូលឈ្មោះរបស់អ្នក៖</b></label><br>
    <input type="text" id="usernameInput" placeholder="វាយបញ្ចូលឈ្មោះរបស់អ្នក...">
    <button onclick="saveName()">រក្សាទុក (Save)</button>
    <button onclick="clearName()">លុប (Clear)</button>
  </p>

  <hr>

  <p><b>ទិន្នន័យដែលបានរក្សាទុកក្នុង Browser:</b></p>
  <p id="displayResult">មិនទាន់មានទិន្នន័យនៅឡើយទេ</p>

  <script>
    // អានទិន្នន័យពី localStorage ពេលទំព័រ load ដំបូង
    function loadSavedName() {
      const savedName = localStorage.getItem('student_name');
      const display = document.getElementById('displayResult');
      if (savedName) {
        display.innerHTML = `👋 សួស្តី <b>${savedName}</b>! ទិន្នន័យនេះត្រូវបានទាញយកពី <code>localStorage</code>។`;
      } else {
        display.innerHTML = 'មិនទាន់មានទិន្នន័យនៅឡើយទេ';
      }
    }

    function saveName() {
      const input = document.getElementById('usernameInput');
      if (input.value.trim() !== '') {
        localStorage.setItem('student_name', input.value.trim());
        loadSavedName();
        input.value = '';
      }
    }

    function clearName() {
      localStorage.removeItem('student_name');
      loadSavedName();
    }

    // ហៅពេល load ដំបូង
    loadSavedName();
  </script>

</body>
</html>
