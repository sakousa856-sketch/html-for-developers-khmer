<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>កូដគំរូ 08: HTML5 Web Storage API (localStorage & sessionStorage)</title>
  <style>
    body {
      font-family: 'Kantumruy Pro', 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f8fafc;
      color: #1e293b;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h1 { color: #2563eb; }
    .input-box {
      display: flex;
      gap: 12px;
      margin: 16px 0;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button.btn-clear {
      background: #ef4444;
    }
    .result-box {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      border-left: 4px solid #2563eb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💾 HTML5 Web Storage API (localStorage Demo)</h1>
    <p>
      <b>localStorage</b> អនុញ្ញាតឱ្យគេហទំព័ររក្សាទុកទិន្នន័យ (Key-Value) នៅក្នុង Browser របស់អ្នកប្រើប្រាស់បានរហូត ទោះបីជាបិទ Tab ឬ Refresh ទំព័រ ក៏ទិន្នន័យមិនបាត់បង់ដែរ។
    </p>

    <div class="input-box">
      <input type="text" id="usernameInput" placeholder="វាយបញ្ចូលឈ្មោះរបស់អ្នក...">
      <button onclick="saveName()">💾 រក្សាទុក (Save)</button>
      <button class="btn-clear" onclick="clearName()">🗑️ លុប (Clear)</button>
    </div>

    <div class="result-box">
      <b>ទិន្នន័យដែលបានរក្សាទុកក្នុង Browser:</b>
      <p id="displayResult" style="font-size: 18px; color: #0f766e; margin-top: 6px;">មិនទាន់មានទិន្នន័យនៅឡើយទេ</p>
    </div>
  </div>

  <script>
    // អានទិន្នន័យពី localStorage ពេលទំព័រ load ដំបូង
    function loadSavedName() {
      const savedName = localStorage.getItem('student_name');
      const display = document.getElementById('displayResult');
      if (savedName) {
        display.innerHTML = `👋 សួស្តី <b>${savedName}</b>! ទិន្នន័យនេះត្រូវបានទាញយកពី <code>localStorage</code>។`;
      } else {
        display.innerHTML = 'មិនទាន់មានទិន្នន័យនៅឡើយទេ';
      }
    }

    function saveName() {
      const input = document.getElementById('usernameInput');
      if (input.value.trim() !== '') {
        localStorage.setItem('student_name', input.value.trim());
        loadSavedName();
        input.value = '';
      }
    }

    function clearName() {
      localStorage.removeItem('student_name');
      loadSavedName();
    }

    // ដំណើរការពេលទំព័របើកឡើង
    loadSavedName();
  </script>

</body>
</html>
