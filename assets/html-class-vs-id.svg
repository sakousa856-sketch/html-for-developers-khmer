<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="classGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="idGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="425" y="42" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HTML Class vs ID: Reusable vs Unique</text>
  <text x="425" y="66" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">ភាពខុសគ្នារវាង Class (ប្រើរួមគ្នាបានច្រើន) និង ID (ឯកត្តជន មានតែមួយគត់)</text>

  <!-- Left Card: Class (Shared) -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="365" height="350" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="365" height="45" rx="12" fill="url(#classGrad)"/>
    <rect x="0" y="30" width="365" height="15" fill="#0284c7"/>
    <text x="182" y="28" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">🏷️ Class Attribute (.classname)</text>

    <!-- Visual Analogy: School Uniforms / Reusable Items -->
    <rect x="15" y="60" width="335" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Multiple elements sharing the same class -->
    <rect x="25" y="72" width="95" height="45" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="72" y="94" fill="#ffffff" font-size="11" font-family="monospace" text-anchor="middle">&lt;button</text>
    <text x="72" y="108" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">class="btn"&gt;</text>

    <rect x="135" y="72" width="95" height="45" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="182" y="94" fill="#ffffff" font-size="11" font-family="monospace" text-anchor="middle">&lt;button</text>
    <text x="182" y="108" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">class="btn"&gt;</text>

    <rect x="245" y="72" width="95" height="45" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="292" y="94" fill="#ffffff" font-size="11" font-family="monospace" text-anchor="middle">&lt;a</text>
    <text x="292" y="108" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">class="btn"&gt;</text>

    <text x="182" y="145" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">👕 ដូចជា «ឯកសណ្ឋានសិស្ស»</text>
    <text x="182" y="165" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">សិស្សច្រើននាក់អាចពាក់អាវម៉ូដដូចគ្នាបាន</text>
    <text x="182" y="185" fill="#a5f3fc" font-size="11" font-family="monospace" text-anchor="middle">CSS: .btn { background: blue; }</text>

    <!-- Points -->
    <g transform="translate(20, 220)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="12" font-family="sans-serif">**អាចប្រើឡើងវិញបានច្រើនដង** ក្នុងទំព័រតែមួយ</text>

      <circle cx="6" cy="32" r="4" fill="#38bdf8"/>
      <text x="18" y="36" fill="#e2e8f0" font-size="12" font-family="sans-serif">ធាតុ ១ អាចមាន **ច្រើន Classes** (ឧ. `class="btn primary lg"`)</text>

      <circle cx="6" cy="58" r="4" fill="#38bdf8"/>
      <text x="18" y="62" fill="#e2e8f0" font-size="12" font-family="sans-serif">ក្នុង CSS ហៅដោយប្រើសញ្ញាចុច **`.` (Dot)**</text>

      <circle cx="6" cy="84" r="4" fill="#38bdf8"/>
      <text x="18" y="88" fill="#67e8f9" font-size="12" font-family="monospace">JS: document.querySelectorAll('.btn')</text>
    </g>
  </g>

  <!-- Right Card: ID (Unique) -->
  <g transform="translate(445, 95)" filter="url(#shadow)">
    <rect width="365" height="350" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="365" height="45" rx="12" fill="url(#idGrad)"/>
    <rect x="0" y="30" width="365" height="15" fill="#d97706"/>
    <text x="182" y="28" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">🆔 ID Attribute (#idname)</text>

    <!-- Visual Analogy: National ID Card / Passport -->
    <rect x="15" y="60" width="335" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Unique ID Card visual -->
    <rect x="35" y="72" width="295" height="48" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="182" y="93" fill="#ffffff" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">&lt;nav id="main-navbar"&gt; ... &lt;/nav&gt;</text>
    <text x="182" y="108" fill="#fef3c7" font-size="10" font-family="sans-serif" text-anchor="middle">🔒 មានតែ ១ គត់ក្នុងទំព័រទាំងមូល (Unique ID)</text>

    <text x="182" y="145" fill="#fbbf24" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">🪪 ដូចជា «លេខអត្តសញ្ញាណប័ណ្ណ»</text>
    <text x="182" y="165" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">មនុស្សម្នាក់មានលេខកូដសម្គាល់តែមួយគត់</text>
    <text x="182" y="185" fill="#fde68a" font-size="11" font-family="monospace" text-anchor="middle">CSS: #main-navbar { position: fixed; }</text>

    <!-- Points -->
    <g transform="translate(20, 220)">
      <circle cx="6" cy="6" r="4" fill="#fbbf24"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="12" font-family="sans-serif">**ដាច់ខាតមានតែមួយគត់** (Unique) ក្នុង HTML មួយទំព័រ</text>

      <circle cx="6" cy="32" r="4" fill="#fbbf24"/>
      <text x="18" y="36" fill="#e2e8f0" font-size="12" font-family="sans-serif">ប្រើសម្រាប់ **Page Bookmarks / Links (#section)**</text>

      <circle cx="6" cy="58" r="4" fill="#fbbf24"/>
      <text x="18" y="62" fill="#e2e8f0" font-size="12" font-family="sans-serif">ក្នុង CSS ហៅដោយប្រើសញ្ញាទ្រុងជ្រូក **`#` (Hash)**</text>

      <circle cx="6" cy="84" r="4" fill="#fbbf24"/>
      <text x="18" y="88" fill="#fde68a" font-size="12" font-family="monospace">JS: document.getElementById('main-navbar')</text>
    </g>
  </g>
</svg>
