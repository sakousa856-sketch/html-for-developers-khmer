<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="svgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="425" y="38" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HTML5 Canvas vs SVG (Raster vs Vector)</text>
  <text x="425" y="62" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">ការប្រៀបធៀបរវាង Canvas (គំនូរភីកសែល Pixel) និង SVG (គំនូរវ៉ិចទ័រ Vector មិនបែកព្រាល)</text>

  <!-- Left Card: HTML Canvas (Raster Pixel) -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="365" height="365" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="365" height="42" rx="12" fill="url(#canvasGrad)"/>
    <rect y="30" width="365" height="12" fill="#b91c1c"/>
    <text x="182" y="27" fill="#ffffff" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">🎨 HTML5 &lt;canvas&gt; (Raster Pixels)</text>

    <!-- Visual Zoom Canvas simulation (Pixelated Circle) -->
    <g transform="translate(20, 55)">
      <rect width="325" height="140" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <!-- Normal Circle -->
      <circle cx="65" cy="70" r="35" fill="#ef4444"/>
      <text x="65" y="125" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">ទំហំដើម (1x)</text>

      <!-- Zoom In Arrow -->
      <text x="135" y="75" fill="#f87171" font-size="18" text-anchor="middle">🔍 8x ➔</text>

      <!-- Pixelated Zoom Grid -->
      <g transform="translate(195, 30)">
        <rect width="80" height="80" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <!-- Pixel Blocks (Jagged edges) -->
        <rect x="0" y="0" width="20" height="20" fill="#450a0a" stroke="#64748b" stroke-width="0.5"/>
        <rect x="20" y="0" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="40" y="0" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="60" y="0" width="20" height="20" fill="#450a0a" stroke="#64748b" stroke-width="0.5"/>
        
        <rect x="0" y="20" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="20" y="20" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="40" y="20" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="60" y="20" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        
        <rect x="0" y="40" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="20" y="40" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="40" y="40" width="20" height="20" fill="#ef4444" stroke="#64748b" stroke-width="0.5"/>
        <rect x="60" y="40" width="20" height="20" fill="#450a0a" stroke="#64748b" stroke-width="0.5"/>

        <rect x="0" y="60" width="20" height="20" fill="#450a0a" stroke="#64748b" stroke-width="0.5"/>
        <rect x="20" y="60" width="20" height="20" fill="#450a0a" stroke="#64748b" stroke-width="0.5"/>
        <rect x="40" y="60" width="20" height="20" fill="#450a0a" stroke="#64748b" stroke-width="0.5"/>
        <rect x="60" y="60" width="20" height="20" fill="#450a0a" stroke="#64748b" stroke-width="0.5"/>
      </g>
      <text x="235" y="125" fill="#f87171" font-size="10" font-family="sans-serif" text-anchor="middle">បែកគ្រាប់ភីកសែល (Blurry)</text>
    </g>

    <!-- Canvas Points -->
    <g transform="translate(20, 215)" font-family="sans-serif" font-size="12">
      <text x="0" y="15" fill="#fca5a5">• **គូរដោយ JavaScript** (ctx.fillRect, ctx.arc)</text>
      <text x="0" y="40" fill="#fca5a5">• **បែកព្រាល** ពេល Zoom ឬប្តូរទំហំ</text>
      <text x="0" y="65" fill="#fca5a5">• គ្មាន DOM ខាងក្នុងទេ (Cannot style with CSS)</text>
      <text x="0" y="90" fill="#fca5a5">• 🎯 **ស័ក្តិសម**: Game 2D/3D, Video Processing</text>
    </g>
  </g>

  <!-- Right Card: HTML SVG (Vector) -->
  <g transform="translate(445, 85)" filter="url(#shadow)">
    <rect width="365" height="365" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="365" height="42" rx="12" fill="url(#svgGrad)"/>
    <rect y="30" width="365" height="12" fill="#6d28d9"/>
    <text x="182" y="27" fill="#ffffff" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">📐 HTML5 &lt;svg&gt; (Vector Math)</text>

    <!-- Visual Zoom SVG simulation (Crisp Vector) -->
    <g transform="translate(20, 55)">
      <rect width="325" height="140" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <!-- Normal Circle -->
      <circle cx="65" cy="70" r="35" fill="#8b5cf6"/>
      <text x="65" y="125" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">ទំហំដើម (1x)</text>

      <!-- Zoom In Arrow -->
      <text x="135" y="75" fill="#c084fc" font-size="18" text-anchor="middle">🔍 8x ➔</text>

      <!-- Smooth Vector Circle Zoom -->
      <g transform="translate(195, 30)">
        <rect width="80" height="80" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <path d="M 10,80 A 70,70 0 0,1 80,10 L 80,80 Z" fill="#8b5cf6" stroke="#c084fc" stroke-width="2"/>
      </g>
      <text x="235" y="125" fill="#a7f3d0" font-size="10" font-family="sans-serif" text-anchor="middle">ច្បាស់ ១០០% (Crisp &amp; Sharp)</text>
    </g>

    <!-- SVG Points -->
    <g transform="translate(20, 215)" font-family="sans-serif" font-size="12">
      <text x="0" y="15" fill="#d8b4fe">• **គូរដោយ XML/Math Equations** (&lt;circle&gt;, &lt;path&gt;)</text>
      <text x="0" y="40" fill="#d8b4fe">• **មិនបែកព្រាលដាច់ខាត** ទោះ Zoom ប៉ុណ្ណាក៏ដោយ</text>
      <text x="0" y="65" fill="#d8b4fe">• ធាតុនិមួយៗជា DOM (អាចដាក់ CSS &amp; JS Events បាន)</text>
      <text x="0" y="90" fill="#d8b4fe">• 🎯 **ស័ក្តិសម**: Icons, Logo, UI Diagram, Charts</text>
    </g>
  </g>
</svg>
