<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mainThreadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="workerThreadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="425" y="38" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HTML5 Web Workers: Multi-Threading Architecture</text>
  <text x="425" y="62" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">ដំណើរការគណនាធ្ងន់ៗលើ Background Thread ដើម្បីកុំឱ្យគាំង Browser UI</text>

  <!-- Top / Left Card: Main Thread (UI Thread) -->
  <g transform="translate(50, 95)" filter="url(#shadow)">
    <rect width="320" height="340" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="320" height="42" rx="12" fill="url(#mainThreadGrad)"/>
    <rect y="30" width="320" height="12" fill="#1d4ed8"/>
    <text x="160" y="27" fill="#ffffff" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">🖥️ Main Thread (UI &amp; DOM)</text>

    <!-- Responsibilities box -->
    <g transform="translate(15, 60)">
      <rect width="290" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#93c5fd" font-size="12" font-family="sans-serif" font-weight="bold">ភារកិច្ចទទួលខុសត្រូវ:</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11" font-family="sans-serif">✨ DOM Rendering &amp; CSS Animation</text>
      <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="sans-serif">🖱️ User Clicks, Typing &amp; Scrolling</text>
      <text x="15" y="100" fill="#34d399" font-size="11" font-family="sans-serif" font-weight="bold">🟢 ដំណើរការរលូន 60 FPS (No Freeze)</text>
    </g>

    <!-- Code Snippet -->
    <g transform="translate(15, 195)">
      <rect width="290" height="125" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
      <text x="12" y="22" fill="#60a5fa" font-size="11" font-family="monospace">const w = new Worker('worker.js');</text>
      <text x="12" y="45" fill="#cbd5e1" font-size="11" font-family="monospace">// ផ្ញើកិច្ចការទៅ Worker</text>
      <text x="12" y="65" fill="#fcd34d" font-size="11" font-family="monospace">w.postMessage({ data: 1000000 });</text>
      <text x="12" y="90" fill="#cbd5e1" font-size="11" font-family="monospace">// ទទួលលទ្ធផលមកវិញ</text>
      <text x="12" y="110" fill="#a7f3d0" font-size="11" font-family="monospace">w.onmessage = (e) =&gt; { ... };</text>
    </g>
  </g>

  <!-- Middle: Message Passing Arrows -->
  <g transform="translate(370, 200)">
    <!-- Right Arrow: postMessage -->
    <path d="M 10 20 L 95 20" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3"/>
    <polygon points="95,15 105,20 95,25" fill="#f59e0b"/>
    <text x="55" y="10" fill="#fcd34d" font-size="10" font-family="monospace" text-anchor="middle">postMessage()</text>

    <!-- Left Arrow: return onmessage -->
    <path d="M 100 70 L 15 70" stroke="#10b981" stroke-width="3" stroke-dasharray="6 3"/>
    <polygon points="15,65 5,70 15,75" fill="#10b981"/>
    <text x="55" y="92" fill="#6ee7b7" font-size="10" font-family="monospace" text-anchor="middle">postMessage()</text>
  </g>

  <!-- Right Card: Background Worker Thread -->
  <g transform="translate(480, 95)" filter="url(#shadow)">
    <rect width="320" height="340" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="320" height="42" rx="12" fill="url(#workerThreadGrad)"/>
    <rect y="30" width="320" height="12" fill="#6d28d9"/>
    <text x="160" y="27" fill="#ffffff" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">⚙️ Worker Thread (Background)</text>

    <!-- Responsibilities box -->
    <g transform="translate(15, 60)">
      <rect width="290" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#c084fc" font-size="12" font-family="sans-serif" font-weight="bold">ភារកិច្ចទទួលខុសត្រូវ:</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11" font-family="sans-serif">🧮 Heavy Loop / Big Math Calculation</text>
      <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="sans-serif">🔐 Data Encryption / Image Processing</text>
      <text x="15" y="100" fill="#f43f5e" font-size="11" font-family="sans-serif">❌ គ្មានសិទ្ធិប៉ះ DOM / Window ផ្ទាល់ទេ</text>
    </g>

    <!-- Code Snippet -->
    <g transform="translate(15, 195)">
      <rect width="290" height="125" rx="6" fill="#0f172a" stroke="#581c87" stroke-width="1"/>
      <text x="12" y="22" fill="#d8b4fe" font-size="11" font-family="monospace">// worker.js</text>
      <text x="12" y="45" fill="#fcd34d" font-size="11" font-family="monospace">onmessage = function(e) {</text>
      <text x="24" y="65" fill="#e9d5ff" font-size="11" font-family="monospace">let res = heavyTask(e.data);</text>
      <text x="24" y="88" fill="#a7f3d0" font-size="11" font-family="monospace">postMessage(res); // ផ្ញើមកវិញ</text>
      <text x="12" y="110" fill="#fcd34d" font-size="11" font-family="monospace">};</text>
    </g>
  </g>
</svg>
