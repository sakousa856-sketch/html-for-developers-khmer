<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Kantumruy Pro', sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .box { rx: 8px; stroke-width: 2; }
      .box-header { fill: #fecdd3; stroke: #e11d48; }
      .box-nav { fill: #fed7aa; stroke: #ea580c; }
      .box-section { fill: #bae6fd; stroke: #0284c7; }
      .box-article { fill: #dcfce7; stroke: #16a34a; }
      .box-aside { fill: #fef08a; stroke: #ca8a04; }
      .box-footer { fill: #e2e8f0; stroke: #475569; }
      .box-main { fill: #ffffff; stroke: #9333ea; stroke-dasharray: 6,6; }
      .tag-label { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .desc-label { font-family: 'Kantumruy Pro', sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="760" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="400" y="45" class="title">📐 ប្លង់គេហទំព័រ Semantic Layout (HTML5 Semantic Elements)</text>

  <!-- Header -->
  <rect x="40" y="65" width="720" height="50" class="box box-header" />
  <text x="400" y="90" class="tag-label">&lt;header&gt;</text>
  <text x="400" y="105" class="desc-label">ក្បាលគេហទំព័រ / Logo / Banner</text>

  <!-- Nav -->
  <rect x="40" y="125" width="720" height="40" class="box box-nav" />
  <text x="400" y="145" class="tag-label">&lt;nav&gt;</text>
  <text x="400" y="158" class="desc-label">របារម៉ឺនុយតំណភ្ជាប់ (Navigation Menu)</text>

  <!-- Main Box Container -->
  <rect x="40" y="175" width="500" height="225" class="box box-main" />
  <text x="90" y="195" font-family="'Fira Code', monospace" font-size="14" fill="#9333ea" font-weight="bold">&lt;main&gt;</text>

  <!-- Section inside Main -->
  <rect x="60" y="205" width="460" height="85" class="box box-section" />
  <text x="290" y="235" class="tag-label">&lt;section&gt;</text>
  <text x="290" y="255" class="desc-label">ផ្នែក ឬជំពូកនៃមាតិកា</text>

  <!-- Article inside Main -->
  <rect x="60" y="300" width="460" height="85" class="box box-article" />
  <text x="290" y="330" class="tag-label">&lt;article&gt;</text>
  <text x="290" y="350" class="desc-label">អត្ថបទព័ត៌មាន ឬ Blog Post ឯករាជ្យ</text>

  <!-- Aside (Sidebar) -->
  <rect x="555" y="175" width="205" height="225" class="box box-aside" />
  <text x="657" y="275" class="tag-label">&lt;aside&gt;</text>
  <text x="657" y="295" class="desc-label">Sidebar / ព័ត៌មានបន្ថែម</text>

  <!-- Footer -->
  <rect x="40" y="410" width="720" height="40" class="box box-footer" />
  <text x="400" y="430" class="tag-label">&lt;footer&gt;</text>
  <text x="400" y="443" class="desc-label">ផ្នែកបាតក្រោម / Copyright / ទំនាក់ទំនង</text>
</svg>
