<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="425" y="38" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HTML Responsive Layout &amp; Viewport</text>
  <text x="425" y="62" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">ការសម្របប្លង់គេហទំព័រទៅតាមទំហំអេក្រង់ឧបករណ៍ផ្សេងៗគ្នា (Mobile, Tablet, Desktop)</text>

  <!-- Viewport Meta Tag Pill -->
  <rect x="175" y="80" width="500" height="34" rx="17" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="425" y="102" fill="#93c5fd" font-size="12" font-family="monospace" text-anchor="middle">&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;</text>

  <!-- Device 1: Desktop (Left) -->
  <g transform="translate(40, 135)" filter="url(#shadow)">
    <!-- Monitor Outer -->
    <rect width="360" height="230" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="230" width="60" height="40" fill="#334155"/>
    <rect x="120" y="270" width="120" height="10" rx="4" fill="#475569"/>

    <!-- Screen Header -->
    <rect x="8" y="8" width="344" height="20" rx="4" fill="#0f172a"/>
    <circle cx="20" cy="18" r="3" fill="#ef4444"/>
    <circle cx="30" cy="18" r="3" fill="#f59e0b"/>
    <circle cx="40" cy="18" r="3" fill="#10b981"/>
    <text x="180" y="22" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">💻 Desktop (&gt; 1024px)</text>

    <!-- 3-Column Grid Layout -->
    <rect x="15" y="36" width="330" height="35" rx="4" fill="#3b82f6"/>
    <text x="180" y="58" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Header &amp; Navigation</text>

    <rect x="15" y="78" width="100" height="135" rx="4" fill="#059669"/>
    <text x="65" y="150" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Col 1</text>

    <rect x="125" y="78" width="110" height="135" rx="4" fill="#2563eb"/>
    <text x="180" y="150" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Col 2 (Main)</text>

    <rect x="245" y="78" width="100" height="135" rx="4" fill="#7c3aed"/>
    <text x="295" y="150" fill="#ffffff" font-size="11" font-family="sans-serif" text-anchor="middle">Col 3</text>

    <!-- Subtitle -->
    <text x="180" y="305" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">3 Columns ផ្ដេក</text>
  </g>

  <!-- Device 2: Tablet (Middle) -->
  <g transform="translate(430, 135)" filter="url(#shadow)">
    <!-- Tablet Outer -->
    <rect width="210" height="270" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Screen Header -->
    <rect x="8" y="8" width="194" height="20" rx="4" fill="#0f172a"/>
    <text x="105" y="22" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">📱 Tablet (768px)</text>

    <!-- 2-Column Responsive Layout -->
    <rect x="15" y="36" width="180" height="30" rx="4" fill="#3b82f6"/>
    <text x="105" y="55" fill="#ffffff" font-size="10" font-family="sans-serif" text-anchor="middle">Header</text>

    <rect x="15" y="72" width="85" height="110" rx="4" fill="#059669"/>
    <text x="57" y="132" fill="#ffffff" font-size="10" font-family="sans-serif" text-anchor="middle">Col 1</text>

    <rect x="110" y="72" width="85" height="110" rx="4" fill="#2563eb"/>
    <text x="152" y="132" fill="#ffffff" font-size="10" font-family="sans-serif" text-anchor="middle">Col 2</text>

    <rect x="15" y="190" width="180" height="60" rx="4" fill="#7c3aed"/>
    <text x="105" y="225" fill="#ffffff" font-size="10" font-family="sans-serif" text-anchor="middle">Col 3 (Wrap)</text>

    <text x="105" y="305" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">2 Columns + Wrap</text>
  </g>

  <!-- Device 3: Mobile (Right) -->
  <g transform="translate(670, 135)" filter="url(#shadow)">
    <!-- Phone Outer -->
    <rect width="140" height="270" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Camera notch -->
    <rect x="50" y="4" width="40" height="6" rx="3" fill="#0f172a"/>
    <rect x="8" y="14" width="124" height="16" rx="3" fill="#0f172a"/>
    <text x="70" y="26" fill="#64748b" font-size="9" font-family="sans-serif" text-anchor="middle">📱 Mobile (375px)</text>

    <!-- 1-Column Stack Layout -->
    <rect x="14" y="36" width="112" height="26" rx="4" fill="#3b82f6"/>
    <text x="70" y="53" fill="#ffffff" font-size="9" font-family="sans-serif" text-anchor="middle">Header</text>

    <rect x="14" y="68" width="112" height="52" rx="4" fill="#059669"/>
    <text x="70" y="98" fill="#ffffff" font-size="9" font-family="sans-serif" text-anchor="middle">Col 1 (100%)</text>

    <rect x="14" y="126" width="112" height="52" rx="4" fill="#2563eb"/>
    <text x="70" y="156" fill="#ffffff" font-size="9" font-family="sans-serif" text-anchor="middle">Col 2 (100%)</text>

    <rect x="14" y="184" width="112" height="52" rx="4" fill="#7c3aed"/>
    <text x="70" y="214" fill="#ffffff" font-size="9" font-family="sans-serif" text-anchor="middle">Col 3 (100%)</text>

    <text x="70" y="305" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">1 Column Stack</text>
  </g>

  <!-- Bottom Tip -->
  <text x="425" y="465" fill="#6ee7b7" font-size="12" font-family="sans-serif" text-anchor="middle">✨ ដោយសារ Responsive Web Design ទំព័រតែមួយអាចបង្ហាញរូបរាងស្អាតលើគ្រប់ឧបករណ៍ដោយស្វ័យប្រវត្តិ!</text>
</svg>
