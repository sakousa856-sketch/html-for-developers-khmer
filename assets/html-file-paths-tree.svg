<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="425" y="40" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HTML File Paths &amp; Directory Tree</text>
  <text x="425" y="64" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">ស្វែងយល់ពីផ្លូវឯកសារ (Relative Paths: ./, ../, subfolder)</text>

  <!-- Left: Directory Tree Card -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="360" height="360" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Tree Header -->
    <rect width="360" height="40" rx="12" fill="#334155"/>
    <text x="20" y="25" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="bold">📁 Project Directory Structure</text>

    <!-- Folder Nodes -->
    <g transform="translate(20, 60)" font-family="monospace" font-size="13">
      <!-- Root -->
      <text x="0" y="20" fill="#fbbf24" font-weight="bold">📁 my-project/</text>
      
      <!-- Branch line -->
      <line x1="12" y1="30" x2="12" y2="260" stroke="#475569" stroke-width="1.5"/>

      <!-- File 1: index.html -->
      <line x1="12" y1="45" x2="30" y2="45" stroke="#475569" stroke-width="1.5"/>
      <rect x="35" y="32" width="130" height="24" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="45" y="49" fill="#93c5fd">📄 index.html</text>

      <!-- Subfolder 1: images/ -->
      <line x1="12" y1="80" x2="30" y2="80" stroke="#475569" stroke-width="1.5"/>
      <text x="35" y="85" fill="#f59e0b">📁 images/</text>
      
      <!-- Sub branch -->
      <line x1="45" y1="95" x2="45" y2="145" stroke="#475569" stroke-width="1.5"/>
      <line x1="45" y1="110" x2="60" y2="110" stroke="#475569" stroke-width="1.5"/>
      <text x="65" y="115" fill="#a7f3d0">🖼️ logo.png</text>
      
      <line x1="45" y1="140" x2="60" y2="140" stroke="#475569" stroke-width="1.5"/>
      <text x="65" y="145" fill="#a7f3d0">🖼️ photo.jpg</text>

      <!-- Subfolder 2: css/ -->
      <line x1="12" y1="175" x2="30" y2="175" stroke="#475569" stroke-width="1.5"/>
      <text x="35" y="180" fill="#f59e0b">📁 css/</text>
      <line x1="45" y1="190" x2="45" y2="205" stroke="#475569" stroke-width="1.5"/>
      <line x1="45" y1="205" x2="60" y2="205" stroke="#475569" stroke-width="1.5"/>
      <text x="65" y="210" fill="#38bdf8">🎨 style.css</text>

      <!-- Subfolder 3: pages/ -->
      <line x1="12" y1="235" x2="30" y2="235" stroke="#475569" stroke-width="1.5"/>
      <text x="35" y="240" fill="#f59e0b">📁 pages/</text>
      <line x1="45" y1="250" x2="45" y2="265" stroke="#475569" stroke-width="1.5"/>
      <line x1="45" y1="265" x2="60" y2="265" stroke="#475569" stroke-width="1.5"/>
      <rect x="62" y="252" width="140" height="24" rx="4" fill="#831843" stroke="#f43f5e" stroke-width="1"/>
      <text x="70" y="269" fill="#fbcfe8">📄 about.html</text>
    </g>
  </g>

  <!-- Right: Path Scenarios & Rules Card -->
  <g transform="translate(425, 90)" filter="url(#shadow)">
    <rect width="385" height="360" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Header -->
    <rect width="385" height="40" rx="12" fill="#334155"/>
    <text x="20" y="25" fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="bold">🛣️ របៀបសរសេរផ្លូវឯកសារ (Path Syntax)</text>

    <!-- Scenario 1: Same level or Subfolder from index.html -->
    <g transform="translate(15, 55)">
      <rect width="355" height="60" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="12" y="22" fill="#93c5fd" font-size="11" font-family="sans-serif">ពី <tspan font-family="monospace" font-weight="bold">index.html</tspan> ហៅចូលក្នុង Folder កូន (Down):</text>
      <text x="12" y="46" fill="#67e8f9" font-size="12" font-family="monospace">&lt;img src="images/logo.png"&gt;</text>
    </g>

    <!-- Scenario 2: Parent folder ../ from about.html -->
    <g transform="translate(15, 125)">
      <rect width="355" height="85" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="12" y="20" fill="#fbcfe8" font-size="11" font-family="sans-serif">ពី <tspan font-family="monospace" font-weight="bold">pages/about.html</tspan> ថយក្រោយ ១ តង់ (Up ../):</text>
      <text x="12" y="44" fill="#fca5a5" font-size="12" font-family="monospace">&lt;a href="../index.html"&gt;Home&lt;/a&gt;</text>
      <text x="12" y="68" fill="#fca5a5" font-size="12" font-family="monospace">&lt;img src="../images/logo.png"&gt;</text>
    </g>

    <!-- Scenario 3: CSS from about.html -->
    <g transform="translate(15, 220)">
      <rect width="355" height="60" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="12" y="22" fill="#d8b4fe" font-size="11" font-family="sans-serif">ថយក្រោយ ១ តង់ រួចចូលទៅ Folder ផ្សេង:</text>
      <text x="12" y="46" fill="#e9d5ff" font-size="12" font-family="monospace">&lt;link href="../css/style.css"&gt;</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(15, 290)">
      <rect width="355" height="55" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="22" fill="#6ee7b7" font-size="11" font-family="sans-serif">💡 <tspan font-family="monospace" font-weight="bold">./</tspan> = ថតបច្ចុប្បន្ន (Current Folder)</text>
      <text x="12" y="42" fill="#6ee7b7" font-size="11" font-family="sans-serif">💡 <tspan font-family="monospace" font-weight="bold">../</tspan> = ថយក្រោយ ១ ថតមេ (Parent Folder)</text>
    </g>
  </g>
</svg>
