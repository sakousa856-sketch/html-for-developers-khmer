<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .code-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 26px; fill: #f8fafc; font-weight: bold; }
      .tag-bracket { fill: #94a3b8; }
      .tag-name { fill: #38bdf8; }
      .attr-name { fill: #f59e0b; }
      .attr-equals { fill: #94a3b8; }
      .attr-val { fill: #4ade80; }
      .content-text { fill: #ffffff; }
      .label-box { rx: 6px; }
      .label-text { font-family: 'Kantumruy Pro', sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .line { stroke-width: 2; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" class="bg" />

  <!-- Title -->
  <text x="400" y="40" font-family="'Kantumruy Pro', sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle" font-weight="bold">
    🔍 កាយវិភាគសាស្ត្រនៃ HTML Element (HTML Element Anatomy)
  </text>

  <!-- Code Display Box -->
  <rect x="50" y="70" width="700" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <text x="80" y="115" class="code-text">
    <tspan class="tag-bracket">&lt;</tspan><tspan class="tag-name">p</tspan>
    <tspan class="attr-name"> class</tspan><tspan class="attr-equals">=</tspan><tspan class="attr-val">"intro"</tspan><tspan class="tag-bracket">&gt;</tspan><tspan class="content-text">សួស្តីពិភពលោក!</tspan><tspan class="tag-bracket">&lt;/</tspan><tspan class="tag-name">p</tspan><tspan class="tag-bracket">&gt;</tspan>
  </text>

  <!-- Opening Tag Pointer -->
  <path d="M 140 140 L 140 190" stroke="#38bdf8" class="line" />
  <rect x="70" y="190" width="140" height="34" fill="#0284c7" class="label-box" />
  <text x="140" y="212" class="label-text">Opening Tag (ស្លាកបើក)</text>

  <!-- Attribute Pointer -->
  <path d="M 235 70 L 235 45" stroke="#f59e0b" class="line" />
  <!-- <rect x="175" y="10" width="120" height="26" fill="#d97706" class="label-box" /> -->
  <!-- <text x="235" y="28" class="label-text">Attribute (លក្ខណៈ)</text> -->

  <!-- Content Pointer -->
  <path d="M 440 140 L 440 190" stroke="#ffffff" class="line" />
  <rect x="370" y="190" width="140" height="34" fill="#475569" class="label-box" />
  <text x="440" y="212" class="label-text">Content (មាតិកា/អត្ថបទ)</text>

  <!-- Closing Tag Pointer -->
  <path d="M 600 140 L 600 190" stroke="#38bdf8" class="line" />
  <rect x="530" y="190" width="140" height="34" fill="#0284c7" class="label-box" />
  <text x="600" y="212" class="label-text">Closing Tag (ស្លាកបិទ)</text>

  <!-- Full Element Bracket Line -->
  <path d="M 60 245 L 740 245" stroke="#a855f7" stroke-width="3" />
  <path d="M 60 240 L 60 250" stroke="#a855f7" stroke-width="3" />
  <path d="M 740 240 L 740 250" stroke="#a855f7" stroke-width="3" />
  <text x="400" y="268" font-family="'Kantumruy Pro', sans-serif" font-size="14" fill="#c084fc" text-anchor="middle" font-weight="bold">
    ✨ សរុបទាំងអស់នេះហៅថា៖ HTML Element
  </text>
</svg>
