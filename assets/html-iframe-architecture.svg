<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="parentHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="iframeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="425" y="40" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HTML &lt;iframe&gt; Architecture</text>
  <text x="425" y="64" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">ស្ថាបត្យកម្មបង្កប់គេហទំព័រ ឬ Media ក្រៅ ចូលក្នុងទំព័រមេ (Inline Frame)</text>

  <!-- Parent Browser Window -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <!-- Browser outer frame -->
    <rect width="730" height="350" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Browser Header Bar -->
    <rect width="730" height="40" rx="10" fill="url(#parentHeader)"/>
    <rect y="30" width="730" height="10" fill="url(#parentHeader)"/>
    
    <!-- Window controls -->
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="100" y="8" width="530" height="24" rx="6" fill="#0f172a"/>
    <text x="120" y="24" fill="#94a3b8" font-size="12" font-family="monospace">🔒 https://mywebsite.kh/lessons/news.html (Parent Webpage)</text>

    <!-- Parent Page Content (Left side) -->
    <g transform="translate(25, 60)">
      <rect width="260" height="24" rx="4" fill="#3b82f6"/>
      <text x="12" y="17" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold">🏠 គេហទំព័រដើមរបស់អ្នក (Host)</text>

      <rect y="35" width="240" height="8" rx="2" fill="#475569"/>
      <rect y="50" width="200" height="8" rx="2" fill="#475569"/>
      <rect y="65" width="220" height="8" rx="2" fill="#475569"/>

      <!-- Attributes Card -->
      <rect y="95" width="260" height="160" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="120" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">🔑 Key Attributes:</text>
      
      <text x="15" y="145" fill="#f8fafc" font-size="11" font-family="monospace">src="..."</text>
      <text x="85" y="145" fill="#94a3b8" font-size="11" font-family="sans-serif">អាសយដ្ឋាន URL</text>

      <text x="15" y="170" fill="#f8fafc" font-size="11" font-family="monospace">width/height</text>
      <text x="110" y="170" fill="#94a3b8" font-size="11" font-family="sans-serif">ទំហំទទឹង &amp; កម្ពស់</text>

      <text x="15" y="195" fill="#f8fafc" font-size="11" font-family="monospace">sandbox</text>
      <text x="85" y="195" fill="#f43f5e" font-size="11" font-family="sans-serif">🛡️ Security sandbox</text>

      <text x="15" y="220" fill="#f8fafc" font-size="11" font-family="monospace">title="..."</text>
      <text x="85" y="220" fill="#a7f3d0" font-size="11" font-family="sans-serif">♿ A11y Description</text>
    </g>

    <!-- Embedded Iframe Box (Right side) -->
    <g transform="translate(320, 60)">
      <rect width="385" height="255" rx="8" fill="url(#iframeGrad)" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 3"/>
      
      <!-- Iframe Header Tag -->
      <rect x="15" y="15" width="355" height="32" rx="6" fill="#4338ca"/>
      <text x="25" y="36" fill="#ffffff" font-size="12" font-family="monospace" font-weight="bold">&lt;iframe src="https://youtube.com/embed/..."&gt;</text>

      <!-- Simulated Video / External embed -->
      <rect x="25" y="60" width="335" height="135" rx="6" fill="#000000" stroke="#4f46e5" stroke-width="1"/>
      
      <!-- Play button -->
      <polygon points="180,110 180,145 210,128" fill="#ef4444"/>
      <circle cx="192" cy="128" r="28" fill="none" stroke="#ef4444" stroke-width="2.5"/>

      <text x="192" y="175" fill="#e2e8f0" font-size="11" font-family="sans-serif" text-anchor="middle">YouTube Video / Google Maps Embed</text>

      <!-- Close tag -->
      <rect x="15" y="208" width="355" height="32" rx="6" fill="#312e81"/>
      <text x="192" y="229" fill="#a5b4fc" font-size="12" font-family="monospace" text-anchor="middle">&lt;/iframe&gt; (Isolated Nested Context)</text>
    </g>
  </g>
</svg>
