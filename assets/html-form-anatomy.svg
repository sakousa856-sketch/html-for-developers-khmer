<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="formGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="425" y="38" fill="#ffffff" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">HTML Form Anatomy &amp; Client-Server Data Flow</text>
  <text x="425" y="62" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">ធាតុផ្សំនៃ Form និងដំណើរការបញ្ជូនទិន្នន័យពី Browser ទៅកាន់ Web Server</text>

  <!-- Left: Form Anatomy Card (Browser Client) -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect width="460" height="365" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>

    <!-- Form Tag Header -->
    <rect width="460" height="42" rx="12" fill="url(#formGrad)"/>
    <rect y="30" width="460" height="12" fill="#0369a1"/>
    <text x="230" y="27" fill="#ffffff" font-size="14" font-family="monospace" font-weight="bold" text-anchor="middle">&lt;form action="/login" method="POST"&gt;</text>

    <!-- Fieldset container -->
    <g transform="translate(20, 55)">
      <rect width="420" height="285" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 2"/>
      
      <!-- Legend tag -->
      <rect x="20" y="-12" width="160" height="24" rx="4" fill="#334155"/>
      <text x="100" y="4" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle">&lt;legend&gt; User Login &lt;/legend&gt;</text>

      <!-- Input Group 1: Username -->
      <g transform="translate(20, 25)">
        <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">&lt;label for="user"&gt;ឈ្មោះគណនី (Username):&lt;/label&gt;</text>
        <rect y="26" width="380" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="15" y="49" fill="#f8fafc" font-size="12" font-family="monospace">vichea_dev</text>
        <text x="365" y="49" fill="#34d399" font-size="14" text-anchor="end">✓</text>
        <text x="0" y="78" fill="#64748b" font-size="10" font-family="monospace">&lt;input type="text" id="user" name="username" required&gt;</text>
      </g>

      <!-- Input Group 2: Password -->
      <g transform="translate(20, 115)">
        <text x="0" y="16" fill="#94a3b8" font-size="12" font-family="monospace">&lt;label for="pwd"&gt;ពាក្យសម្ងាត់ (Password):&lt;/label&gt;</text>
        <rect y="26" width="380" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="15" y="50" fill="#f8fafc" font-size="14" font-family="monospace">••••••••••••</text>
        <text x="0" y="78" fill="#64748b" font-size="10" font-family="monospace">&lt;input type="password" id="pwd" name="password" required&gt;</text>
      </g>

      <!-- Submit Button -->
      <g transform="translate(20, 205)">
        <rect width="380" height="38" rx="6" fill="#10b981"/>
        <text x="190" y="24" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">🚀 &lt;button type="submit"&gt; ចូលប្រើប្រាស់ (Submit) &lt;/button&gt;</text>
      </g>
    </g>
  </g>

  <!-- Right: Data Flow & Web Server -->
  <g transform="translate(530, 85)" filter="url(#shadow)">
    <!-- Data Stream / Arrow -->
    <path d="M 0 100 L 40 100" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3"/>
    <polygon points="40,95 52,100 40,105" fill="#f59e0b"/>

    <!-- Payload Box -->
    <rect x="10" y="30" width="260" height="90" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="140" y="52" fill="#fbbf24" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">HTTP POST /login</text>
    <text x="25" y="74" fill="#fde68a" font-size="11" font-family="monospace">username: "vichea_dev"</text>
    <text x="25" y="96" fill="#fde68a" font-size="11" font-family="monospace">password: "Secret@123"</text>
    <text x="140" y="112" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">(Key ចេញពី name="..." របស់ Input)</text>

    <!-- Web Server Box -->
    <g transform="translate(10, 150)">
      <rect width="260" height="200" rx="10" fill="url(#serverGrad)" stroke="#6366f1" stroke-width="2"/>
      
      <!-- Server icon -->
      <text x="130" y="35" fill="#ffffff" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle">🗄️ Backend Server</text>
      <text x="130" y="55" fill="#c7d2fe" font-size="11" font-family="sans-serif" text-anchor="middle">(Node.js / PHP / Java / Python)</text>

      <line x1="20" y1="70" x2="240" y2="70" stroke="#4f46e5" stroke-width="1.5"/>

      <!-- Server tasks -->
      <g transform="translate(25, 85)" font-family="sans-serif" font-size="11" fill="#e0e7ff">
        <text x="0" y="15">1. ទទួល Request Body</text>
        <text x="0" y="40">2. ផ្ទៀងផ្ទាត់ Password ក្នុង DB</text>
        <text x="0" y="65">3. ឆ្លើយតបមក Client វិញ (200 OK)</text>
      </g>

      <rect x="25" y="160" width="210" height="26" rx="4" fill="#10b981"/>
      <text x="130" y="177" fill="#ffffff" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">HTTP 200 OK / Dashboard</text>
    </g>
  </g>
</svg>
